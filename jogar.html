<title>Aprenda jogando · LUCAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#EDF1F7; --surface-3:#E4E9F2;
  --line:#D6DDE8; --line-2:#E6EBF3;
  --ink:#101728; --ink-2:#46505F; --ink-3:#8893A4;
  --blue:#1D4ED8; --blue-d:#1A3FAE; --blue-ink:#16307A;
  --good:#15803D; --good-soft:#E6F4EC; --danger:#C0392B; --danger-soft:#FBEEEC;
  --gold:#B45309; --win:#0E8F63;
  --focus:rgba(29,78,216,.20);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --sh-1:0 1px 2px rgba(16,23,40,.05);
  --sh-2:0 2px 6px rgba(16,23,40,.05), 0 16px 32px -18px rgba(16,23,40,.24);
  --sh-3:0 30px 70px -22px rgba(16,23,40,.36);
  --maxw:720px; --ease:cubic-bezier(.22,.7,.25,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh;}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
.poppins,.display,.h2,.brand-name,.big,.stat .n{font-family:'Poppins',sans-serif;}
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);}
.topbar-in{max-width:var(--maxw);margin:0 auto;padding:11px clamp(16px,4vw,24px);display:flex;align-items:center;gap:11px;}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;border:none;background:none;font:inherit;color:inherit;}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--blue);display:grid;place-items:center;flex-shrink:0;box-shadow:0 5px 14px -5px rgba(29,78,216,.75);}
.brand-name{font-weight:800;font-size:20px;letter-spacing:.4px;line-height:1;}
.brand-sub{font-size:11px;font-weight:600;color:var(--ink-3);}
.sp{flex:1;}
.tlink{border:none;background:none;font:inherit;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer;padding:8px 11px;border-radius:9px;transition:.15s;}
.tlink:hover{color:var(--blue);background:var(--surface-2);}
.main{max-width:var(--maxw);margin:0 auto;padding:clamp(18px,4vw,34px) clamp(16px,4vw,24px) 80px;}
.view{animation:rise .34s var(--ease);}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.crumb{display:inline-flex;align-items:center;gap:7px;border:none;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;padding:6px 0;margin-bottom:14px;}
.crumb:hover{color:var(--blue);}
.eyebrow{font-weight:700;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);}
.display{font-weight:800;font-size:clamp(26px,6vw,38px);line-height:1.05;letter-spacing:-.02em;}
.h2{font-weight:700;font-size:clamp(20px,4vw,26px);letter-spacing:-.01em;}
.lede{font-size:16px;color:var(--ink-2);line-height:1.5;}
.muted{color:var(--ink-3);font-size:13px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh-1);}

/* modos (home) */
.modes{display:grid;gap:14px;margin-top:22px;}
@media(min-width:560px){.modes{grid-template-columns:1fr 1fr;}}
.mode{display:flex;gap:15px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;box-shadow:var(--sh-1);transition:all .18s var(--ease);font:inherit;color:inherit;}
.mode:hover{border-color:var(--blue);box-shadow:var(--sh-2);transform:translateY(-2px);}
.mode-ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:var(--blue);}
.mode.s .mode-ic{background:var(--ink);}.mode.g .mode-ic{background:var(--good);}.mode.r .mode-ic{background:var(--gold);}
.mode-t{display:block;font-weight:700;font-size:16px;}
.mode-d{display:block;color:var(--ink-3);font-size:13px;margin-top:3px;line-height:1.4;}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:var(--sh-1);}
.hero .display{color:var(--ink);}
.rotw{display:inline-block;color:var(--blue);transition:opacity .26s ease,transform .26s ease;}
.rotw.out{opacity:0;transform:translateY(-10px);}
.hero .display b{color:var(--blue);}
.hero .lede{color:var(--ink-2);}
.hero .ba{display:flex;gap:10px;align-items:stretch;margin-top:18px;flex-wrap:wrap;}
.hero .bc{flex:1;min-width:160px;background:var(--surface-2);border-radius:12px;padding:13px 15px;font-size:13.5px;line-height:1.45;color:var(--ink-2);border-left:3px solid var(--line);}
.hero .bc.antes{border-left-color:var(--danger);}
.hero .bc.after{border-left-color:var(--good);color:var(--ink);font-weight:600;}
.hero .bc .tg{font-weight:800;font-size:10px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:6px;}
.hero .bc.antes .tg{color:var(--danger);}
.hero .bc.after .tg{color:var(--good);}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:11px;padding:13px 18px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:.15s;width:100%;}
.btn:active{transform:translateY(1px);}.btn:disabled{opacity:.5;pointer-events:none;}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 8px 18px -9px rgba(29,78,216,.9);}
.btn-primary:hover{background:var(--blue-d);}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--ink-3);}
.btn-block{max-width:380px;margin:0 auto;}
.btn-auto{width:auto;}
.field{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font:inherit;font-size:15px;color:var(--ink);transition:.15s;}
.field:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--focus);}
.row2{display:flex;gap:10px;}.row2>*{flex:1;min-width:0;}

/* quiz */
.qbar{height:7px;background:var(--surface-3);border-radius:100px;overflow:hidden;margin:2px 0 14px;}
.qbar i{display:block;height:100%;background:var(--blue);border-radius:100px;transition:width .35s var(--ease);}
.scoreline{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink-3);margin-bottom:12px;}
.pill{display:inline-block;background:var(--surface-2);color:var(--blue-ink);font-weight:700;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:5px 11px;border-radius:100px;margin-bottom:12px;}
.qprompt{font-family:'Poppins';font-weight:600;font-size:clamp(17px,3vw,21px);line-height:1.3;}
.qsubject{font-family:'Poppins';font-weight:700;font-size:clamp(20px,4vw,26px);color:var(--blue);margin-top:8px;}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.opt{font:inherit;font-size:15px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;cursor:pointer;line-height:1.4;transition:.13s;color:var(--ink);}
.opt:hover{border-color:var(--ink-3);}
.opt:disabled{cursor:default;}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600;}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft);color:var(--danger);}
.fb{margin-top:16px;border-radius:var(--r-sm);padding:13px 15px;font-size:14px;line-height:1.5;display:none;}
.fb.show{display:block;animation:rise .2s;}
.fb.ok{background:var(--good-soft);color:var(--good);}.fb.no{background:var(--danger-soft);color:#8c2a20;}
.fb b{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;}
.fb-timer{height:4px;background:rgba(0,0,0,.10);border-radius:100px;margin-top:12px;overflow:hidden;}
.fb-timer i{display:block;height:100%;width:100%;background:currentColor;opacity:.55;animation:fbcount 5s linear forwards;}
@keyframes fbcount{from{width:100%;}to{width:0%;}}

/* result */
.result{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:32px 22px;}
.result .big{font-size:60px;font-weight:800;line-height:1;color:var(--blue);}
.result .stars{font-size:30px;margin:8px 0;letter-spacing:4px;}
.result .msg{color:var(--ink-2);margin:6px 0 20px;}

/* dicionário / flashcards */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:100px;padding:0 16px;height:50px;margin:6px 0 12px;}
.search input{flex:1;border:none;background:transparent;font:inherit;font-size:15px;outline:none;color:var(--ink);}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.chip{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;color:var(--ink-2);}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.dword{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:9px;box-shadow:var(--sh-1);}
.dword .cat{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:6px;}
.dword .t{font-family:'Poppins';font-weight:700;font-size:16px;color:var(--blue);}
.dword .arr{color:var(--ink-3);font-size:12px;}
.dword .s{font-weight:600;font-size:15px;color:var(--good);}
.dcount{font-size:12.5px;color:var(--ink-3);margin-bottom:10px;}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:34px 22px;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;}
.flash .chip2{font-weight:700;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);background:var(--surface-2);padding:5px 12px;border-radius:100px;margin-bottom:18px;}
.flash .front{font-family:'Poppins';font-weight:700;font-size:26px;color:var(--blue-ink);}
.flash .back{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);width:100%;}
.flash .lab{font-weight:700;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--good);}
.flash .simple{font-family:'Poppins';font-weight:700;font-size:22px;color:var(--good);margin-top:4px;}
.flash .hint{margin-top:16px;font-size:13px;color:var(--ink-3);}
.flashnav{display:flex;align-items:center;gap:10px;margin-top:14px;}
.flashnav .count{flex:1;text-align:center;font-weight:600;color:var(--ink-3);}

/* ranking */
.rk{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh-1);}
.rk .pos{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;font-family:'Poppins';font-weight:700;font-size:14px;color:#fff;background:var(--ink-3);}
.rk.top1 .pos{background:var(--win);}.rk.top2 .pos{background:var(--blue);}.rk.top3 .pos{background:var(--gold);}
.rk .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rk .sub{font-size:12px;color:var(--ink-3);font-weight:400;}
.rk .pc{font-family:'Poppins';font-weight:700;font-size:17px;color:var(--blue-ink);}
.empty{text-align:center;color:var(--ink-3);padding:26px;font-size:14px;}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:30px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.toasts{position:fixed;left:0;right:0;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:30px;font-size:13.5px;font-weight:600;box-shadow:var(--sh-3);opacity:0;transform:translateY(14px);transition:.25s;}
.toast.on{opacity:1;transform:none;}.toast.ok{background:var(--good);}.toast.err{background:var(--danger);}
footer{max-width:var(--maxw);margin:0 auto;padding:26px 24px 44px;text-align:center;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);}
footer b{color:var(--ink-2);font-weight:700;letter-spacing:.04em;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 10px;text-align:center;box-shadow:var(--sh-1);}
.kpi .n{font-family:'Poppins';font-weight:800;font-size:24px;color:var(--blue);}
.kpi .l{font-size:11px;color:var(--ink-3);margin-top:4px;}
</style>
</head>

/* ---------- QUIZ ---------- */
let Q=null;
function buildQuiz(n){
  const terms=allTerms();
  const allMean=terms.map(t=>t.s[0]);
  const tipos=['traduzir','conceito','maisclara'];
  const qs=[];
  for(let i=0;i<n;i++){
    const tipo=pick(tipos);
    if(tipo==='traduzir'){
      const it=pick(terms),correct=it.s[0];
      const ds=shuffle(allMean.filter(m=>m!==correct));
      qs.push({comp:it.cat,q:'O que significa, em linguagem simples?',subject:it.t,opts:shuffle([correct,ds[0],ds[1],ds[2]]),correct:correct,expl:'"'+it.t+'" = '+it.s.join(' / ')+'.'});
    }else if(tipo==='conceito'){
      const c=pick(CONCEITOS);
      qs.push({comp:'conceitos',q:c.p,subject:null,opts:shuffle(c.o.slice()),correct:c.o[c.c],expl:c.e});
    }else{
      const cl=pick(CLAREZA);
      const ds=shuffle(CLAREZA.filter(x=>x.bom!==cl.bom).map(x=>x.ruim));
      qs.push({comp:'clareza',q:'Qual frase está em linguagem simples?',subject:null,opts:shuffle([cl.bom,ds[0],ds[1],ds[2]]),correct:cl.bom,expl:cl.dica});
    }
  }
  return qs;
}
function viewQuiz(modo){
  const n=modo==='simulado'?20:10;
  Q={modo:modo,qs:buildQuiz(n),i:0,hits:0,det:{},done:false};
  renderQ();
}
function renderQ(){
  const q=Q.qs[Q.i];
  render(`
    <button class="crumb" onclick="seSair()">${svgBack()}Sair</button>
    <div class="qbar"><i style="width:${(Q.i/Q.qs.length)*100}%"></i></div>
    <div class="scoreline"><span>Questão ${Q.i+1} de ${Q.qs.length}</span><span>✓ ${Q.hits}</span></div>
    <div class="card">
      <span class="pill">${q.comp}</span>
      <div class="qprompt">${esc(q.q)}</div>
      ${q.subject?`<div class="qsubject">"${esc(q.subject)}"</div>`:''}
      <div class="opts" id="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}" onclick="responder(${k})">${esc(o)}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>
      <button class="btn btn-primary btn-block" id="next" style="display:none;margin-top:18px;" onclick="proxima()">Próxima</button>
    </div>`);
}
function responder(k){
  if(Q.answered) return; Q.answered=true;
  const q=Q.qs[Q.i];
  const acertou=q.opts[k]===q.correct;
  document.querySelectorAll('#opts .opt').forEach(b=>{b.disabled=true;const ok=q.opts[+b.dataset.k]===q.correct;if(ok)b.classList.add('right');if(+b.dataset.k===k&&!acertou)b.classList.add('wrong');});
  Q.det[q.comp]=Q.det[q.comp]||{a:0,t:0};Q.det[q.comp].t++;
  if(acertou){Q.hits++;Q.det[q.comp].a++;}
  const fb=$('#fb');fb.className='fb show '+(acertou?'ok':'no');
  fb.innerHTML=`<b>${acertou?'Certo!':'Quase…'}</b>${esc(q.expl||(acertou?'':'A resposta certa está em verde.'))}<div class="fb-timer"><i></i></div>`;
  const nx=$('#next');nx.style.display='flex';nx.textContent=(Q.i+1>=Q.qs.length?'Ver resultado':'Próxima')+' →';
  clearTimeout(Q.timer);
  Q.timer=setTimeout(proxima,5200);   // tempo de leitura (~5s); clicar adianta
}
function proxima(){ clearTimeout(Q.timer); Q.answered=false; if(Q.i+1>=Q.qs.length){ fimQuiz(); }else{ Q.i++; renderQ(); } }
function seSair(){ clearTimeout(Q&&Q.timer); if(confirm('Sair do quiz? O progresso desta partida será perdido.')) nav('/'); }
function fimQuiz(){
  Q.done=true;
  const pct=Math.round(100*Q.hits/Q.qs.length);
  const stars=pct>=90?'★★★':pct>=70?'★★☆':pct>=40?'★☆☆':'☆☆☆';
  const msg=pct>=90?'Mestre da clareza!':pct>=70?'Muito bem — aprovado!':pct>=40?'Bom começo, continue praticando.':'Bora revisar o dicionário e tentar de novo.';
  salvarHist({pct:pct,modo:Q.modo,quando:Date.now(),acertos:Q.hits,total:Q.qs.length});
  render(`
    <div class="result">
      <div class="big">${pct}%</div>
      <div class="stars">${stars}</div>
      <div class="msg">${esc(msg)}<br><span class="muted">${Q.hits} de ${Q.qs.length} acertos</span></div>
      <div id="saveArea"></div>
    </div>
    <div class="row2" style="margin-top:14px;max-width:420px;margin-left:auto;margin-right:auto;">
      <button class="btn btn-ghost" onclick="nav('/quiz/${Q.modo}')">Jogar de novo</button>
      <button class="btn btn-primary" onclick="nav('/ranking')">Ver ranking</button>
    </div>`);
  renderSave(pct);
}
function renderSave(pct){
  const area=$('#saveArea');
  area.innerHTML=`
    <p class="muted" style="margin:4px 0 10px;">Entre no ranking — basta um nome:</p>
    <input class="field" id="s-nome" maxlength="40" placeholder="Seu nome" value="${esc(nomeSalvo())}" style="margin-bottom:8px;">
    <input class="field" id="s-email" type="email" maxlength="120" placeholder="E-mail (opcional)" value="${esc(emailSalvo())}" style="margin-bottom:12px;">
    <button class="btn btn-primary btn-block" id="s-go" onclick="salvarPont(${pct})">Salvar no ranking</button>`;
}
async function salvarPont(pct){
  const nome=$('#s-nome').value.trim(), email=$('#s-email').value.trim();
  if(!nome) return toast('Escreva seu nome para entrar no ranking');
  if(email && !/.+@.+\..+/.test(email)) return toast('Confira o e-mail');
  const b=$('#s-go'),o=b.innerHTML;b.disabled=true;b.textContent='Salvando…';
  try{
    localStorage.setItem('jogo_nome',nome);if(email)localStorage.setItem('jogo_email',email);
    await db.registrar({nome:nome,email:email,modo:Q.modo,acertos:Q.hits,total:Q.qs.length,detalhes:Q.det});
    $('#saveArea').innerHTML=`<div class="fb show ok" style="display:block;">✓ Pontuação salva no ranking!</div>`;
    toast('Você entrou no ranking!','ok');
  }catch(e){ b.disabled=false;b.innerHTML=o; toast(e.message||'Não consegui salvar','err'); }
}

function setDict(f){dictFiltro=f;document.querySelectorAll('#dchips .chip').forEach(c=>c.classList.toggle('on',c.dataset.f===f));desenhaDict();}
function desenhaDict(){
  const q=norm(($('#dq')||{}).value||'');
  let arr=[];
  DICT_CATS.forEach(c=>{ if(dictFiltro==='todos'||dictFiltro===c.id) c.data.forEach(x=>arr.push({t:x.t,s:x.s,cat:c.label})); });
  if(q) arr=arr.filter(x=>norm(x.t).includes(q)||x.s.some(s=>norm(s).includes(q)));
  arr.sort((a,b)=>a.t.localeCompare(b.t));
  $('#dcount').textContent=arr.length+(arr.length===1?' termo':' termos');
  $('#dlist').innerHTML=arr.length?arr.map(x=>`<div class="dword"><div class="cat">${esc(x.cat)}</div><div class="t">${esc(x.t)}</div><div class="arr">significa</div><div class="s">${esc(x.s.join(' · '))}</div></div>`).join(''):`<div class="empty">Nada encontrado para "${esc(q)}".</div>`;
}

    <p class="eyebrow">Placar</p><h1 class="h2" style="margin:8px 0 6px;">Ranking</h1>
    <p class="muted" style="margin-bottom:14px;">As melhores partidas de todo mundo. Jogue um quiz para entrar.</p>
    <div class="kpis" id="meusKpis" style="margin-bottom:18px;"></div>
    <div id="rk"><div class="spin"></div></div>
    <div class="row2" style="margin-top:16px;max-width:420px;"><button class="btn btn-primary" onclick="nav('/quiz/rapido')">Quiz rápido</button><button class="btn btn-ghost" onclick="nav('/quiz/simulado')">Simulado</button></div>`);
  // KPIs locais
  const h=lerHist();
  const melhor=h.length?Math.max.apply(null,h.map(x=>x.pct)):0;
  const partidas=h.length;
  const media=h.length?Math.round(h.reduce((s,x)=>s+x.pct,0)/h.length):0;
  $('#meusKpis').innerHTML=`<div class="kpi"><div class="n">${partidas}</div><div class="l">partidas</div></div><div class="kpi"><div class="n">${melhor}%</div><div class="l">seu recorde</div></div><div class="kpi"><div class="n">${media}%</div><div class="l">sua média</div></div>`;
  db.ranking(null).then(arr=>{
    const box=$('#rk'); if(!box)return;
    if(!arr||!arr.length){ box.innerHTML=`<div class="empty">Ranking vazio. Seja o primeiro!</div>`; return; }
    box.innerHTML=arr.map((r,i)=>`<div class="rk ${i<3?'top'+(i+1):''}"><div class="pos">${i+1}</div><div class="nm">${esc(r.nome)}<span class="sub"> · ${r.acertos}/${r.total} · ${r.modo==='simulado'?'simulado':'rápido'}</span></div><div class="pc">${r.pct}%</div></div>`).join('');
  }).catch(e=>{ const box=$('#rk'); if(box) box.innerHTML=`<div class="empty">Não consegui carregar o ranking.<br><span class="muted">${esc(e.message||'')}</span></div>`; });
}

/* ---------- init ---------- */
if(!sb){ app.innerHTML='<div class="empty" style="margin-top:40px;">Falta configurar o Supabase no topo do script.</div>'; }
else router();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D4ED8">
<title>LUCAS · Linguagem Simples</title>
<meta name="description" content="Iniciativa de linguagem simples do Gabinete do Conselheiro Carlos Cezar, do Tribunal de Contas do Estado de São Paulo. No centro, um editor que mede a facilidade de leitura e ajuda a reescrever produtos técnicos, com enquetes de clareza, aprendizagem, jogo e dicionário.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{
  /* identidade do projeto LUCAS: azul institucional, sem pastéis */
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#EDF1F7; --surface-3:#E4E9F2;
  --line:#D6DDE8; --line-2:#E6EBF3;
  --ink:#101728; --ink-2:#46505F; --ink-3:#8893A4;
  --blue:#1D4ED8; --blue-d:#1A3FAE; --blue-ink:#16307A;
  --gold:#B45309; --good:#15803D; --danger:#C0392B; --live:#DC2626;
  --win:#0E8F63; --win-soft:#E6F4EE;
  --focus:rgba(29,78,216,.20);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --sh-1:0 1px 2px rgba(16,23,40,.05);
  --sh-2:0 2px 6px rgba(16,23,40,.05), 0 16px 32px -18px rgba(16,23,40,.24);
  --sh-3:0 30px 70px -22px rgba(16,23,40,.36);
  --maxw:780px;
  --ease:cubic-bezier(.22,.7,.25,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  font-family:'Nunito Sans',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100dvh;
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
::selection{background:#cfe0fc;}
.poppins,.display,.h2,.brand-name,.stat .n,.modal-t,.center-state h1,.keyval,.lucas-l{font-family:'Poppins',system-ui,sans-serif;}
.mono{font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;}

/* ---------- TOPBAR ---------- */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);}
.topbar-in{position:relative;max-width:var(--maxw);margin:0 auto;padding:11px clamp(16px,4vw,24px);display:flex;align-items:center;gap:10px;}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;border:none;background:none;font:inherit;color:inherit;padding:0;}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--blue);display:grid;place-items:center;flex-shrink:0;box-shadow:0 5px 14px -5px rgba(29,78,216,.75);}
.brand-tx{text-align:left;line-height:1;}
.brand-name{display:block;font-weight:800;font-size:21px;letter-spacing:.5px;color:var(--ink);}
.brand-sub{display:block;font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;margin-top:3px;}
.topbar-spacer{flex:1;}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:all .15s var(--ease);}
.iconbtn:hover{border-color:var(--blue);color:var(--blue);}
.iconbtn:active{transform:scale(.94);}
.tlink{border:none;background:none;font:inherit;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer;padding:8px 11px;border-radius:9px;transition:all .15s var(--ease);}
.tlink:hover{color:var(--blue);background:var(--surface-2);}
/* CTA principal (Editor) em destaque na topbar */
.nav-cta{display:inline-flex;align-items:center;gap:7px;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:9px 15px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;box-shadow:0 6px 15px -8px rgba(29,78,216,.9);transition:background .15s var(--ease),transform .1s;}
.nav-cta:hover{background:var(--blue-d);color:#fff;}
.nav-cta:active{transform:translateY(1px);}
/* menu de overflow (⋯) — visível no desktop e no mobile */
.menu-btn{display:grid;}
.mobile-menu .only-mobile{display:none;}
@media(max-width:720px){ .mobile-menu .only-mobile{display:flex;} }
.mobile-menu{position:absolute;top:calc(100% + 8px);right:clamp(16px,4vw,24px);min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 44px -18px rgba(16,23,40,.4),0 4px 12px -6px rgba(16,23,40,.18);padding:7px;display:flex;flex-direction:column;gap:2px;z-index:60;opacity:0;transform:translateY(-8px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .16s var(--ease),transform .16s var(--ease);}
.mobile-menu.on{opacity:1;transform:none;pointer-events:auto;}
.mobile-menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--ink);padding:12px 13px;border-radius:10px;cursor:pointer;transition:background .13s,color .13s;}
.mobile-menu button:hover,.mobile-menu button:active{background:var(--surface-2);color:var(--blue);}
.mobile-menu .mi-ic{flex-shrink:0;display:grid;place-items:center;width:20px;color:var(--ink-3);}
.mobile-menu button:hover .mi-ic,.mobile-menu button:active .mi-ic{color:var(--blue);}
@media(max-width:720px){
  .tlink{display:none;}
  .home-btn{display:none;}
  .menu-btn{display:grid;}
}

/* ---------- LAYOUT ---------- */
.main{max-width:var(--maxw);margin:0 auto;padding:clamp(20px,4vw,38px) clamp(16px,4vw,24px) 70px;}
.view{animation:rise .38s var(--ease);}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.crumb{display:inline-flex;align-items:center;gap:7px;border:none;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;padding:6px 0;margin-bottom:16px;transition:color .15s;}
.crumb:hover{color:var(--blue);}

/* ---------- TIPOGRAFIA ---------- */
.display{font-weight:800;font-size:clamp(30px,6.4vw,48px);line-height:1.02;letter-spacing:-.02em;}
.h2{font-weight:700;font-size:clamp(22px,4.4vw,30px);line-height:1.1;letter-spacing:-.015em;}
.eyebrow{font-weight:700;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);}
.lede{font-size:clamp(16px,2.4vw,18.5px);color:var(--ink-2);line-height:1.5;}
.muted{color:var(--ink-3);font-size:13px;line-height:1.5;}
.label{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:8px;}
.label .opt-tag{font-weight:500;color:var(--ink-3);}

/* ---------- HERO ---------- */
.hero{padding:clamp(8px,3vw,26px) 0 clamp(20px,4vw,32px);}
.hero .display{margin-top:12px;}
.hero .display b{color:var(--blue);font-weight:800;}
.hero .lede{max-width:48ch;margin-top:14px;}

/* ---------- AÇÕES ---------- */
.grid{display:grid;gap:14px;}
@media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr;}}
.action{display:flex;gap:15px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;cursor:pointer;transition:all .18s var(--ease);box-shadow:var(--sh-1);font:inherit;color:inherit;}
.action:hover{border-color:var(--blue);box-shadow:var(--sh-2);transform:translateY(-2px);}
.action:active{transform:none;}
.action-ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:var(--blue);}
.action.alt .action-ic{background:var(--ink);}
.action.dim .action-ic{background:var(--surface-3);color:var(--ink-2);}
.action-body{min-width:0;}
.action-t{display:block;font-weight:700;font-size:16px;line-height:1.2;}
.action-d{display:block;color:var(--ink-3);font-size:13.5px;margin-top:4px;line-height:1.4;}
.action .arr{margin-left:auto;color:var(--ink-3);flex-shrink:0;transition:transform .18s var(--ease);}
.action:hover .arr{transform:translateX(3px);color:var(--blue);}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,22px);box-shadow:var(--sh-1);}
.note{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:13px 15px;font-size:13px;color:var(--ink-2);line-height:1.55;display:flex;gap:11px;}
.note>svg{flex-shrink:0;color:var(--blue);margin-top:1px;}
.note a,.linkb{color:var(--blue);font-weight:700;cursor:pointer;text-decoration:none;background:none;border:none;font:inherit;padding:0;}
.note a:hover,.linkb:hover{text-decoration:underline;}
/* chips do formulário Fale conosco */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);font:inherit;font-size:13.5px;font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer;transition:all .15s var(--ease);}
.chip:hover{border-color:var(--ink-3);color:var(--ink);}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 14px -8px rgba(29,78,216,.9);}
/* caixa "indique um material" nas páginas de artigos/cursos */
.tip-cta{margin-top:22px;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:15px 17px;display:flex;gap:13px;align-items:center;}
.tip-cta .ic{flex-shrink:0;width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);}
.tip-cta .tx{font-size:13.5px;color:var(--ink-2);line-height:1.5;}
.tip-cta .tx b{color:var(--ink);}
.note.warn{background:var(--surface-2);border-left:3px solid var(--gold);}
.note.warn>svg{color:var(--gold);}

/* texto original */
.original{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:0 var(--r) var(--r) 0;padding:18px 20px;box-shadow:var(--sh-1);}
.original .olbl{display:flex;align-items:center;gap:7px;margin-bottom:9px;}
.original .otext{font-weight:600;font-size:clamp(16px,2.5vw,19px);line-height:1.4;}
.original .octx{margin-top:14px;padding-top:13px;border-top:1px solid var(--line-2);}

/* ---------- FORM ---------- */
.field{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font:inherit;font-size:15px;color:var(--ink);transition:border-color .15s,box-shadow .15s;}
.field::placeholder{color:var(--ink-3);}
.field:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--focus);}
textarea.field{resize:vertical;min-height:54px;line-height:1.5;}
.fw{margin-bottom:16px;}
.row2{display:flex;gap:10px;}
.row2>*{flex:1;min-width:0;}
.counter{text-align:right;font-size:11px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums;}
.counter.near{color:var(--gold);font-weight:600;}
.counter.full{color:var(--danger);font-weight:700;}
.addline{display:inline-flex;align-items:center;gap:7px;background:none;border:none;font:inherit;font-size:13.5px;font-weight:700;color:var(--blue);cursor:pointer;padding:6px 0;}
.addline:hover{color:var(--blue-d);}
.verline{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
.verline .field-wrap{flex:1;min-width:0;}
.rm{width:46px;height:50px;flex-shrink:0;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink-3);display:grid;place-items:center;cursor:pointer;transition:all .15s;}
.rm:hover{border-color:var(--danger);color:var(--danger);}

.seg{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:5px;}
.seg-item{flex:1;position:relative;}
.seg-item input{position:absolute;opacity:0;pointer-events:none;}
.seg-item label{display:block;text-align:center;padding:10px 8px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);transition:all .15s;}
.seg-item .si{display:flex;justify-content:center;margin-bottom:5px;color:var(--ink-3);transition:color .15s;}
.seg-item input:checked+label .si{color:var(--blue);}
.seg-item .s2{display:block;font-size:11px;font-weight:500;color:var(--ink-3);margin-top:2px;}
.seg-item input:checked+label{background:var(--surface);color:var(--blue-ink);box-shadow:var(--sh-1);border:1px solid var(--line);}
.seg-item input:checked+label .s2{color:var(--blue);}
.seg-item input:focus-visible+label{box-shadow:0 0 0 3px var(--focus);}
.prazo3{display:flex;gap:10px;}
.prazo3>div{flex:1;text-align:center;}
.prazo3 .field{text-align:center;font-weight:700;padding:11px 6px;}
.prazo3 small{display:block;font-size:11px;color:var(--ink-3);margin-top:5px;}
details.adv{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;margin-bottom:8px;box-shadow:var(--sh-1);}
details.adv>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;}
details.adv>summary::-webkit-details-marker{display:none;}
details.adv>summary .gear{color:var(--ink-3);}
details.adv>summary .chev{margin-left:auto;color:var(--ink-3);transition:transform .2s;}
details.adv[open]>summary .chev{transform:rotate(180deg);}
.adv-body{padding:0 16px 18px;}
.adv-body .sub{font-size:12px;font-weight:700;color:var(--ink-2);margin:16px 0 8px;display:flex;align-items:center;gap:6px;}

/* ---------- BOTÕES ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:11px;padding:13px 18px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:all .15s var(--ease);width:100%;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.55;pointer-events:none;}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 8px 18px -9px rgba(29,78,216,.9);}
.btn-primary:hover{background:var(--blue-d);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-dark:hover{opacity:.9;}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--ink-3);}
.btn-danger-ghost{background:var(--surface);color:var(--danger);border-color:#e3bdb8;}
.btn-danger-ghost:hover{background:#fbeeec;}
.btn-block{max-width:380px;margin-left:auto;margin-right:auto;}
.btn-auto{width:auto;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}
.cta-wrap{margin-top:22px;}

.copybar{display:flex;gap:8px;align-items:stretch;}
.copybar .val{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:0 14px;background:var(--surface);font-family:ui-monospace,monospace;font-size:13px;color:var(--ink);display:flex;align-items:center;overflow:hidden;}
.copybar .val span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.keybox{border:1.5px dashed var(--blue);background:var(--surface);border-radius:var(--r);padding:18px;text-align:center;}
.keyval{font-weight:700;font-size:clamp(19px,5.4vw,26px);letter-spacing:.06em;color:var(--blue-ink);}

/* ---------- VOTAR ---------- */
.votezone{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r);padding:16px;margin-top:18px;}
.votezone-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
.opts{display:grid;gap:10px;}
.opt{position:relative;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:15px 16px;cursor:pointer;transition:all .15s var(--ease);box-shadow:var(--sh-1);}
.opt:hover{border-color:var(--ink-3);}
.opt input{position:absolute;opacity:0;pointer-events:none;}
.opt .box{width:24px;height:24px;flex-shrink:0;border:2px solid #b9c1cf;border-radius:7px;display:grid;place-items:center;color:#fff;transition:all .15s;margin-top:1px;}
.opt .box.radio{border-radius:50%;}
.opt .box svg{opacity:0;transform:scale(.55);transition:all .15s;}
.opt input:checked~.box{background:var(--blue);border-color:var(--blue);}
.opt input:checked~.box svg{opacity:1;transform:none;}
.opt:has(input:checked){border-color:var(--blue);box-shadow:0 0 0 3px var(--focus);}
.opt input:focus-visible~.box{box-shadow:0 0 0 4px var(--focus);}
.otxt{font-size:15px;line-height:1.45;}
.votezone-ft{display:flex;justify-content:flex-end;font-size:12.5px;color:var(--ink-3);margin-top:12px;font-variant-numeric:tabular-nums;}

/* ---------- RESULTADO ---------- */
.stats{display:flex;gap:10px;}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--sh-1);}
.stat .n{font-weight:700;font-size:clamp(22px,5vw,28px);color:var(--ink);line-height:1;}
.stat .l{font-size:11.5px;color:var(--ink-3);margin-top:6px;}
.rank{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--sh-1);}
.rank.win{border-color:var(--win);border-left:4px solid var(--win);box-shadow:var(--sh-2);}
.win-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--win);margin-bottom:9px;}
.rank-top{display:flex;align-items:flex-start;gap:12px;}
.rank-pos{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--ink-3);}
.rank.win .rank-pos{background:var(--win);}
.rank-txt{font-size:15px;line-height:1.45;flex:1;}
.bar-row{display:flex;align-items:center;gap:12px;margin-top:12px;}
.bar{flex:1;height:9px;background:var(--surface-3);border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;background:var(--blue);transition:width .8s var(--ease);}
.rank.win .bar-fill{background:var(--win);}
.pct{font-size:13px;font-weight:700;min-width:62px;text-align:right;font-variant-numeric:tabular-nums;}

/* ---------- PAINEL ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.03em;}
.badge-live{background:var(--live);color:#fff;box-shadow:0 0 0 4px rgba(220,38,38,.14);}
.badge-live .dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.3s ease-in-out infinite;}
.badge-end{background:#7a8395;color:#fff;}
.badge-count{background:var(--blue);color:#fff;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.sug{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--sh-1);}
.sug-txt{font-size:14.5px;line-height:1.45;}
.sug-by{font-size:12px;color:var(--ink-3);margin-top:4px;}
.sug-acts{display:flex;gap:9px;margin-top:13px;}
.sug-acts .btn{flex:1;padding:9px;font-size:13px;}
.rdc{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:8px;box-shadow:var(--sh-1);}
.rdc .ok{color:var(--good);flex-shrink:0;display:grid;}
.rdc .t{flex:1;font-size:14px;line-height:1.4;}
.divider{height:1px;background:var(--line);border:0;margin:24px 0;}
.editlink{display:inline-flex;align-items:center;gap:6px;background:none;border:none;font:inherit;font-size:13px;font-weight:700;color:var(--blue);cursor:pointer;padding:9px 0 0;}
.painel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.painel-head .badge{margin-top:4px;}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.sec-h .eyebrow{color:var(--ink-3);}
.filters{display:flex;gap:7px;margin:14px 0;}
.filter{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:all .15s;}
.filter.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.mine{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh-1);transition:border-color .15s;}
.mine:hover{border-color:var(--ink-3);}
.mine-main{flex:1;min-width:0;cursor:pointer;}
.mine-t{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mine-sub{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:9px;}
.st{display:inline-flex;align-items:center;gap:5px;font-weight:700;}
.st .d{width:6px;height:6px;border-radius:50%;}
.st.live{color:var(--live);} .st.live .d{background:var(--live);}
.st.end{color:var(--ink-3);} .st.end .d{background:var(--ink-3);}
.mine-acts{display:flex;gap:7px;flex-shrink:0;}
.mini{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:all .15s;}
.mini:hover{border-color:var(--blue);color:var(--blue);}
.mini.danger:hover{border-color:var(--danger);color:var(--danger);}

/* estados */
.center-state{text-align:center;padding:44px 20px;}
.center-state .ic{width:64px;height:64px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;margin:0 auto 16px;color:var(--ink-3);}
.center-state.ok .ic{background:var(--blue);color:#fff;}
.center-state h1{font-weight:700;}
.empty{text-align:center;padding:26px 18px;color:var(--ink-3);font-size:14px;line-height:1.5;}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading{display:flex;justify-content:center;padding:60px 0;}
.errbox{background:#fbeeec;border:1px solid #e3bdb8;border-radius:var(--r-sm);padding:13px 15px;color:#8c2a20;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;}
.errbox svg{flex-shrink:0;margin-top:1px;}
.spin-sm{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}

/* modal / popover / toast */
.scrim{position:fixed;inset:0;z-index:200;background:rgba(16,23,40,.46);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;}
.scrim.on{opacity:1;pointer-events:auto;}
.modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:420px;padding:24px;box-shadow:var(--sh-3);transform:translateY(12px) scale(.97);transition:transform .22s var(--ease);}
.scrim.on .modal{transform:none;}
.modal-t{font-weight:700;font-size:20px;margin-bottom:9px;}
.modal-d{color:var(--ink-2);font-size:14px;line-height:1.5;margin-bottom:18px;}
.modal-acts{display:flex;gap:10px;}
.modal-acts .btn{flex:1;}
.pop{position:fixed;z-index:210;max-width:320px;background:var(--ink);color:#eef2f8;padding:16px 17px;border-radius:14px;box-shadow:var(--sh-3);font-size:13px;line-height:1.55;opacity:0;transform:translateY(6px);pointer-events:none;transition:all .18s var(--ease);}
.pop.on{opacity:1;transform:none;}
.pop .pt{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;margin-bottom:6px;color:#fff;}
.pop b{color:#fff;}
.pop .acro{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;}
.pop .acro span{font-size:11px;background:rgba(255,255,255,.12);border-radius:6px;padding:3px 7px;}
.pop .acro span b{font-family:'Poppins',sans-serif;color:#9ec1ff;}
.toasts{position:fixed;left:0;right:0;bottom:24px;z-index:220;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px;}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:30px;font-size:13.5px;font-weight:600;box-shadow:var(--sh-3);display:flex;align-items:center;gap:9px;max-width:90vw;transform:translateY(16px);opacity:0;transition:all .26s var(--ease);}
.toast.on{transform:none;opacity:1;}
.toast.ok{background:var(--good);}
.toast.err{background:var(--danger);}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:300;}
.config-miss{max-width:420px;text-align:center;padding:30px;}
footer{max-width:var(--maxw);margin:0 auto;padding:28px 24px 48px;color:var(--ink-3);font-size:12.5px;border-top:1px solid var(--line);text-align:center;}
.focusable:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}

/* ---------- MANUAL / APRENDER ---------- */
.m-quote{position:relative;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:var(--r);padding:24px 26px;margin:22px 0 6px;box-shadow:var(--sh-1);}
.m-quote .q{font-family:'Poppins';font-weight:600;font-size:clamp(18px,3vw,23px);line-height:1.38;color:var(--ink);}

.m-quote .qs{position:relative;font-size:12.5px;color:var(--ink-3);margin-top:12px;}
.m-sec{margin-top:44px;}
.m-sec h2{font-family:'Poppins';font-weight:700;font-size:clamp(22px,4vw,28px);letter-spacing:-.015em;margin:6px 0 6px;}
/* módulos do LUCAS (guarda-chuva) */
.mods{display:grid;gap:14px;}
@media(min-width:600px){.mods{grid-template-columns:1fr 1fr;}}
.mod{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 21px;box-shadow:var(--sh-1);text-decoration:none;color:inherit;}
.mod h3{font-family:'Poppins';font-weight:700;font-size:16.5px;letter-spacing:-.01em;margin:14px 0 2px;color:var(--ink);}

.mod-top{display:flex;align-items:center;justify-content:space-between;}

.mod-ic-b{background:var(--blue);border-color:var(--blue);}
.mod-badge{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line);padding:5px 10px;border-radius:999px;}
.mod-badge-b{color:var(--blue);background:var(--blue-soft,#EAF0FE);border-color:var(--blue-line,#C9D9FB);}

.mod-link:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 16px 34px -18px rgba(29,78,216,.5);}
.mod-go{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:14px;color:var(--blue);margin-top:14px;}
.mod-here{opacity:.96;}

@media(min-width:620px){.pillars{grid-template-columns:repeat(3,1fr);}}
.pillar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;box-shadow:var(--sh-1);text-align:center;}

.pillar h3{font-family:'Poppins';font-weight:700;font-size:17px;}

.prin-grid{display:grid;gap:12px;}

.prin{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh-1);}

.prin p{color:var(--ink-2);font-size:13.5px;margin-top:3px;line-height:1.45;}
.notgrid{display:grid;gap:10px;}
@media(min-width:620px){.notgrid{grid-template-columns:1fr 1fr;}}
.notitem{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;font-size:14px;box-shadow:var(--sh-1);line-height:1.45;}
.notitem .xi{color:var(--danger);flex-shrink:0;margin-top:1px;}
.notitem b{color:var(--ink);}
.bignums{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);}

.bignum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;text-align:center;box-shadow:var(--sh-1);}
.bignum .v{font-family:'Poppins';font-weight:800;font-size:clamp(30px,7vw,40px);color:var(--blue);line-height:1;letter-spacing:-.02em;}
.bignum .d{font-size:12px;color:var(--ink-2);margin-top:9px;line-height:1.4;}
.axes{display:grid;gap:12px;}
@media(min-width:620px){.axes{grid-template-columns:1fr 1fr;}}
.axis{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh-1);}

.axis .an{width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;font-family:'Poppins';font-weight:700;font-size:13px;display:grid;place-items:center;flex-shrink:0;}
.axis h3{font-family:'Poppins';font-weight:700;font-size:15.5px;}
.axis ul{list-style:none;}
.axis li{position:relative;padding-left:18px;font-size:13.5px;color:var(--ink-2);margin:7px 0;line-height:1.45;}
.axis li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--blue);}
.axis li b{color:var(--ink);}
.ba{display:grid;grid-template-columns:1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px;box-shadow:var(--sh-1);background:var(--surface);}
@media(min-width:640px){.ba{grid-template-columns:1fr 1fr;}}
.ba-card{padding:16px 18px;}

.ba-lbl{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.ba-card.antes .ba-lbl{color:var(--danger);}
.ba-card.depois .ba-lbl{color:var(--good);}
.ba-card p{font-size:14.5px;line-height:1.5;}

.ba-card.depois p{color:var(--ink);font-weight:600;}
.ba-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:7px;padding:4px 11px;margin:8px 0 9px;}

.swaps{display:flex;flex-wrap:wrap;gap:8px;}

.swap .ev{color:var(--danger);text-decoration:line-through;text-decoration-color:rgba(192,57,43,.55);}
.swap .ar{color:var(--ink-3);display:grid;}
.swap .us{color:var(--good);font-weight:700;}
.chklist{display:grid;gap:8px;}
.chk-item{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;cursor:pointer;box-shadow:var(--sh-1);transition:border-color .15s;}

.chk-item input:checked~.cb{background:var(--good);border-color:var(--good);}

.chk-item input:checked~.cb svg{opacity:1;}
.chk-item .ctxt{font-size:14px;line-height:1.4;}
.chk-item input:checked~.ctxt{color:var(--ink-3);text-decoration:line-through;}
.chk-item input:focus-visible~.cb{box-shadow:0 0 0 3px var(--focus);}
.test-grid{display:grid;gap:12px;}

/* ---------- utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function attr(v){ return JSON.stringify(v).replace(/"/g,'&quot;'); }
function linkDe(codigo){ return location.origin + location.pathname + '?e=' + codigo; }
const app = () => document.getElementById('app');
function trataErro(e){ let m=(e&&e.message)?e.message:'Algo deu errado'; return m.replace(/^.*?:\s*/, (m.includes(' ')&&m.length<90)?'':''); }

/* ---------- db (espelha as RPCs) ---------- */
const db = {
  async rpc(fn, args){ const {data,error}=await sb.rpc(fn,args); if(error) throw new Error(trataErro(error)); return data; },
  criar(p){ return db.rpc('criar_enquete',{p_titulo:p.titulo,p_contexto:p.contexto||null,p_nome:p.nome,p_email:p.email,p_redacoes:p.redacoes,p_tipo_voto:p.tipo_voto,p_mostrar_resultado:p.mostrar_resultado,p_prazo_min:p.prazo_min}); },
  votar(codigo){ return db.rpc('obter_para_votar',{p_codigo:codigo}); },
  registrar(codigo,ids,nome,com){ return db.rpc('registrar_voto',{p_codigo:codigo,p_token:deviceToken(),p_redacao_ids:ids,p_nome:nome||null,p_comentario:com||null}); },
  sugerir(codigo,texto,nome,email){ return db.rpc('sugerir_redacao',{p_codigo:codigo,p_texto:texto,p_nome:nome||null,p_email:email||null}); },
  painel(chave){ return db.rpc('obter_painel',{p_chave:chave}); },
  curar(chave,id,acao){ return db.rpc('curar_redacao',{p_chave:chave,p_redacao_id:id,p_acao:acao}); },
  encerrar(chave){ return db.rpc('encerrar_enquete',{p_chave:chave}); },
  editar(chave,ctx){ return db.rpc('editar_enquete',{p_chave:chave,p_contexto:ctx||null}); },
  remover(chave,id){ return db.rpc('remover_redacao',{p_chave:chave,p_redacao_id:id}); },
  excluir(chave){ return db.rpc('excluir_enquete',{p_chave:chave}); },
  status(cods){ return db.rpc('status_enquetes',{p_codigos:cods}); },
  resultado(codigo,chave){ return db.rpc('obter_resultado',{p_codigo:codigo,p_chave:chave||null}); },
  artigos(){ return db.rpc('listar_artigos',{}); },
  cursos(){ return db.rpc('listar_cursos',{}); },
  contato(o){ return db.rpc('enviar_contato',{p_tipo:o.tipo,p_mensagem:o.mensagem||null,p_nome:o.nome||null,p_email:o.email||null,p_material:o.material||null,p_titulo:o.titulo||null,p_url:o.url||null,p_token:deviceToken()}); }
};

/* ---------- localStorage ---------- */
function deviceToken(){ let t=localStorage.getItem('lucas2_dev'); if(!t){ t=(crypto.randomUUID?crypto.randomUUID():'d'+Math.random().toString(36).slice(2)+Date.now()); localStorage.setItem('lucas2_dev',t);} return t; }
function lerMinhas(){ try{return JSON.parse(localStorage.getItem('lucas2_minhas')||'[]');}catch{return[];} }
function salvarMinha(reg){ const l=lerMinhas().filter(x=>x.codigo!==reg.codigo); l.unshift(reg); localStorage.setItem('lucas2_minhas',JSON.stringify(l.slice(0,40))); }
function removerMinha(cod){ localStorage.setItem('lucas2_minhas',JSON.stringify(lerMinhas().filter(x=>x.codigo!==cod))); }

const S = { chave:null, gerado:null, votar:null, painel:null, sel:new Set(), ultima:null, statusCache:{}, filtro:'todas' };

/* ---------- toast ---------- */
function toast(msg,type){ const w=document.getElementById('toasts'); const t=document.createElement('div'); t.className='toast'+(type?' '+type:''); t.textContent=msg; w.appendChild(t); requestAnimationFrame(()=>t.classList.add('on')); setTimeout(()=>{ t.classList.remove('on'); setTimeout(()=>t.remove(),300); },2800); }

/* ---------- modal ---------- */
function fecharModal(){ const s=$('#scrim'); s.classList.remove('on'); setTimeout(()=>$('#modal').innerHTML='',200); }
function _modal(html){ $('#modal').innerHTML=html; $('#scrim').classList.add('on'); }
function modalConfirm(o){
  _modal(`<p class="modal-t">${esc(o.titulo)}</p><p class="modal-d">${esc(o.msg)}</p>
    <div class="modal-acts"><button class="btn btn-ghost" onclick="fecharModal()">${esc(o.cancel||'Cancelar')}</button>
    <button class="btn ${o.danger?'btn-danger-ghost':'btn-primary'}" id="mok">${esc(o.ok||'Confirmar')}</button></div>`);
  $('#mok').onclick=()=>{ fecharModal(); o.onOk&&o.onOk(); };
}
function modalPrompt(o){
  const f=o.multiline?`<textarea class="field" id="min" maxlength="${MAXCH}" placeholder="${esc(o.ph||'')}" style="min-height:90px;margin-bottom:16px;">${esc(o.val||'')}</textarea>`:`<input class="field" id="min" value="${esc(o.val||'')}" placeholder="${esc(o.ph||'')}" style="margin-bottom:16px;">`;
  _modal(`<p class="modal-t">${esc(o.titulo)}</p>${o.msg?`<p class="modal-d">${esc(o.msg)}</p>`:''}${f}
    <div class="modal-acts"><button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
    <button class="btn btn-primary" id="mok">${esc(o.ok||'Salvar')}</button></div>`);
  const i=$('#min'); setTimeout(()=>i.focus(),60);
  const go=()=>{ const v=i.value.trim(); fecharModal(); o.onOk&&o.onOk(v); };
  $('#mok').onclick=go; if(!o.multiline) i.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();go();} };
}

/* ---------- popover "sobre" (explica o nome LUCAS) ---------- */
let popTimer=null, popOpen=false;
function abrirPop(btn){
  clearTimeout(popTimer); const p=$('#pop');
  p.innerHTML=`<p class="pt">O que é o LUCAS?</p>Vem do latim <b>lux</b> (luz): a promessa de <b>clarear o que é confuso</b>. É a plataforma de <b>Linguagem Simples</b> para os Tribunais de Contas.<div class="acro"><span><b>L</b> Leve</span><span><b>U</b> Útil</span><span><b>C</b> Claro</span><span><b>A</b> Acolhedor</span><span><b>S</b> Simples</span></div>`;
  const r=btn.getBoundingClientRect();
  p.style.left=Math.max(12,Math.min(r.left-10, innerWidth-332))+'px'; p.style.top=(r.bottom+10)+'px';
  p.classList.add('on');
}
function fecharPop(){ popTimer=setTimeout(()=>{ if(!popOpen) $('#pop').classList.remove('on'); },120); }
function togglePop(btn){ popOpen=!popOpen; if(popOpen) abrirPop(btn); else $('#pop').classList.remove('on'); }
document.addEventListener('click',e=>{ if(popOpen && !e.target.closest('#aboutBtn') && !e.target.closest('#pop')){ popOpen=false; $('#pop').classList.remove('on'); } });

/* ---------- contador ---------- */
document.addEventListener('input',e=>{ if(e.target.classList && e.target.classList.contains('counted')) contar(e.target); });
function contar(elm){ const w=elm.closest('.field-wrap'); if(!w)return; const c=w.querySelector('.counter'); if(!c)return; const n=(elm.value||'').length; c.textContent=n+'/'+MAXCH; c.classList.toggle('full',n>=MAXCH); c.classList.toggle('near',n>=MAXCH*0.9&&n<MAXCH); }
function fieldWrap(inner){ return `<div class="field-wrap">${inner}<div class="counter">0/${MAXCH}</div></div>`; }

/* ================= ROTEADOR ================= */
function nav(path){ location.hash='#'+path; }
/* menu sanduíche (mobile) */
function toggleMenu(e){ if(e) e.stopPropagation(); const m=document.getElementById('mobileMenu'),b=document.getElementById('menuBtn'); const open=m.classList.toggle('on'); if(b) b.setAttribute('aria-expanded',open?'true':'false'); }
function closeMenu(){ const m=document.getElementById('mobileMenu'),b=document.getElementById('menuBtn'); if(m) m.classList.remove('on'); if(b) b.setAttribute('aria-expanded','false'); }
function menuGo(path,ext){ closeMenu(); if(ext){ location.href=path; } else { nav(path); } }
document.addEventListener('click',e=>{ if(!e.target.closest('#mobileMenu') && !e.target.closest('#menuBtn')) closeMenu(); });
function render(html){ const a=app(); a.innerHTML=`<div class="view">${html}</div>`; a.querySelectorAll('.field-wrap .counted').forEach(contar); window.scrollTo(0,0); }
function loading(){ render(`<div class="loading"><div class="spin"></div></div>`); }
async function router(){
  const q=new URLSearchParams(location.search);
  if(q.get('e') && !location.hash){ const c=q.get('e').toUpperCase(); history.replaceState(null,'',location.pathname); location.hash='#/v/'+c; return; }
  const hash=location.hash.replace(/^#/,'')||'/';
  const [_,seg,arg]=hash.split('/');
  try{
    if(!seg) return viewHome();
    if(seg==='enquetes') return viewEnquetes();
    if(seg==='criar') return viewCriar();
    if(seg==='v') return viewVotar(arg);
    if(seg==='votado') return viewVotado();
    if(seg==='criada') return viewCriada();
    if(seg==='r') return viewResultado(arg);
    if(seg==='minhas') return viewMinhas();
    if(seg==='chave') return viewChave();
    if(seg==='painel') return viewPainel();
    if(seg==='aprender') return viewAprender();
    if(seg==='artigos') return viewArtigos();
    if(seg==='cursos') return viewCursos();
    if(seg==='contato') return viewContato(arg);
    viewAprender();
  }catch(e){ render(`<div class="errbox">${IC.alerta18}${esc(e.message||'Erro')}</div>`); }
}
window.addEventListener('hashchange',router);

function addVersao(val){
  const c=$('#c-versoes'); if(c.querySelectorAll('.verline').length>=8){ toast('Máximo de 8 versões'); return; }
  const row=document.createElement('div'); row.className='verline';
  row.innerHTML=`${fieldWrap(`<textarea class="field counted ver-in" maxlength="${MAXCH}" placeholder="Uma forma mais clara de dizer… (opcional)" style="min-height:50px;">${esc(val||'')}</textarea>`)}<button class="rm" title="Remover" onclick="rmVersao(this)">${IC.lixo17}</button>`;
  c.appendChild(row); contar(row.querySelector('.ver-in')); countVersoes();
}
function rmVersao(b){ b.closest('.verline').remove(); countVersoes(); }
function countVersoes(){ const n=$('#c-versoes').querySelectorAll('.verline').length; $('#c-count').textContent=n+' de 8 versões'; $('#c-add').style.display=n>=8?'none':'inline-flex'; }
function prazoMin(){ const d=+$('#p-d').value||0,h=+$('#p-h').value||0,m=+$('#p-m').value||0; return Math.max(0,d)*1440+Math.max(0,h)*60+Math.max(0,m); }
function fmtDur(min){ const d=Math.floor(min/1440),h=Math.floor(min%1440/60),m=min%60,p=[]; if(d)p.push(d+(d===1?' dia':' dias')); if(h)p.push(h+(h===1?' hora':' horas')); if(m)p.push(m+' min'); return p.join(' e ')||'0 min'; }
function tempoRestante(prazo){ if(!prazo) return '—'; const diff=new Date(prazo).getTime()-Date.now(); if(diff<=0) return 'encerrando'; const d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),m=Math.floor(diff%3600000/60000); if(d>0) return d+'d '+h+'h'; if(h>0) return h+'h '+m+'m'; return m+' min'; }
function prazoHint(){ const el=$('#p-hint'); if(!el)return; const t=prazoMin(); if(t<5){el.style.color='var(--danger)';el.textContent='O prazo mínimo é 5 minutos.';}else if(t>10080){el.style.color='var(--danger)';el.textContent='O prazo máximo é 7 dias — será ajustado.';}else{el.style.color='';el.textContent='Encerra em '+fmtDur(t)+'.';} }
function erroCriar(m){ $('#cerr').innerHTML=`<div class="errbox" style="margin-bottom:16px;">${IC.alerta18}${esc(m)}</div>`; window.scrollTo(0,0); }
async function enviarCriar(){
  const nome=$('#c-nome').value.trim(),email=$('#c-email').value.trim(),titulo=$('#c-titulo').value.trim(),contexto=$('#c-contexto').value.trim();
  const redacoes=[...document.querySelectorAll('.ver-in')].map(t=>t.value.trim()).filter(Boolean);
  if(!nome||!email) return erroCriar('Preencha seu nome e e-mail.');
  if(!/.+@.+\..+/.test(email)) return erroCriar('Confira o e-mail.');
  if(!titulo) return erroCriar('Diga o que você quer deixar mais claro.');
  let pmin=prazoMin(); if(pmin<5) return erroCriar('O prazo mínimo é 5 minutos.'); if(pmin>10080) pmin=10080;
  const tipo=document.querySelector('input[name=tipo]:checked').value, res=document.querySelector('input[name=res]:checked').value;
  const b=$('#c-go'),o=b.innerHTML; b.disabled=true; b.innerHTML='<span class="spin-sm"></span> Criando…';
  try{ const r=await db.criar({titulo,contexto,nome,email,redacoes,tipo_voto:tipo,mostrar_resultado:res,prazo_min:pmin});
    const reg={codigo:r.codigo,chave:r.chave,titulo,link:linkDe(r.codigo),criada:Date.now()}; salvarMinha(reg); S.gerado=reg; nav('/criada');
  }catch(e){ erroCriar(e.message); b.disabled=false; b.innerHTML=o; }
}

function toggleOpt(input){
  const id=input.value;
  if(S.votar.tipo_voto==='unico') S.sel=new Set([id]);
  else { if(input.checked) S.sel.add(id); else S.sel.delete(id); }
  const c=$('#vcount'); if(c){ const n=S.sel.size; c.textContent=n===0?'nenhuma marcada':(n===1?'1 marcada':n+' marcadas'); }
  botaoVoto();
}
function sugsPreenchidas(){ return [...document.querySelectorAll('.sug-in')].map(t=>t.value.trim()).filter(Boolean); }
function botaoVoto(){ const b=$('#v-go'); if(!b||b.disabled)return; const sug=sugsPreenchidas().length,marc=S.sel.size,tem=S.votar.redacoes&&S.votar.redacoes.length>0; b.textContent=(marc>0&&sug>0)?'Enviar voto e sugestão':sug>0?(sug>1?'Enviar sugestões':'Enviar sugestão'):tem?'Confirmar voto':'Sugerir versão'; }
function toggleSugerir(){
  const a=$('#sug-area'); if(a.dataset.on){ a.innerHTML=''; a.dataset.on=''; botaoVoto(); return; }
  a.dataset.on='1';
  a.innerHTML=`<div class="card" style="border-style:dashed;border-color:var(--blue);margin-top:10px;"><p class="muted" style="font-size:13px;margin-bottom:10px;">Escreva sua versão. Pode propor mais de uma — e apagar as que quiser. Tudo entra no botão <b>Confirmar</b> abaixo.</p><div id="sug-rows"></div><button class="addline" onclick="addSug()">${IC.mais.replace('width="24" height="24"','width="16" height="16"')}Adicionar outra versão</button><p class="muted" style="margin-top:8px;">Para sugerir é preciso preencher <b>nome e e-mail</b> (logo abaixo). Suas versões aguardam o autor aprovar.</p></div>`;
  addSug();
}
function addSug(val){
  const r=$('#sug-rows'); if(r.querySelectorAll('.verline').length>=5){ toast('Até 5 sugestões por vez'); return; }
  const row=document.createElement('div'); row.className='verline';
  row.innerHTML=`${fieldWrap(`<textarea class="field counted sug-in" maxlength="${MAXCH}" placeholder="Como você diria de um jeito mais claro?" oninput="botaoVoto()" style="min-height:50px;">${esc(val||'')}</textarea>`)}<button class="rm" title="Apagar" onclick="rmSug(this)">${IC.lixo17}</button>`;
  r.appendChild(row); contar(row.querySelector('.sug-in')); botaoVoto();
}
function rmSug(b){ const r=$('#sug-rows'); if(r.querySelectorAll('.verline').length<=1){ toast('Deixe ao menos uma'); return; } b.closest('.verline').remove(); botaoVoto(); }
async function enviarVoto(){
  const marc=[...S.sel],sug=sugsPreenchidas(),tem=S.votar.redacoes&&S.votar.redacoes.length>0;
  if(marc.length===0&&sug.length===0) return toast(tem?'Marque uma versão ou escreva a sua sugestão':'Escreva a sua sugestão para participar');
  const nome=$('#v-nome').value.trim(),email=($('#v-email')||{}).value.trim(),com=($('#v-com')||{}).value.trim();
  if(sug.length>0){ if(!nome||!email) return toast('Para sugerir, preencha nome e e-mail'); if(!/.+@.+\..+/.test(email)) return toast('Confira o e-mail'); }
  const b=$('#v-go'),o=b.innerHTML; b.disabled=true; b.innerHTML='<span class="spin-sm"></span> Enviando…';
  try{ for(const t of sug) await db.sugerir(S.votar.codigo,t,nome,email); if(marc.length>0) await db.registrar(S.votar.codigo,marc,nome,com||null);
    S.ultima={votou:marc.length>0,sugeriu:sug.length,codigo:S.votar.codigo}; nav('/votado');
  }catch(e){ toast(e.message||'Não consegui enviar','err'); b.disabled=false; b.innerHTML=o; }
}

  if(!vis.length){ box.innerHTML=h+`<div class="empty">Nenhuma enquete neste filtro.</div>`; return; }

  }).join('');
  box.innerHTML=h;
}

function setCTipo(t){
  CTipo=t;
  document.querySelectorAll('#ct-tipos .chip').forEach(c=>c.classList.toggle('on',c.dataset.t===t));
  const ind=t==='indicacao';
  const blk=document.getElementById('ct-ind'); if(blk) blk.style.display=ind?'block':'none';
  const lab=document.getElementById('ct-msglabel'); if(lab) lab.innerHTML=ind?'Por que você recomenda? <span class="opt-tag">(opcional)</span>':'Sua mensagem';
}
function setCMat(m){
  CMat=m;
  document.querySelectorAll('#ct-mats .chip').forEach(c=>c.classList.toggle('on',c.dataset.m===m));
}
async function enviarContato(){
  const val=id=>{ const e=document.getElementById(id); return e?e.value.trim():''; };
  const msg=val('ct-msg'), nome=val('ct-nome'), email=val('ct-email'), titulo=val('ct-titulo'), url=val('ct-url');
  if(CTipo==='indicacao'){ if(!titulo && !url) return toast('Diga o nome ou o link do material','err'); }
  else if(!msg){ return toast('Escreva a sua mensagem','err'); }
  if(email && !/.+@.+\..+/.test(email)) return toast('Confira o e-mail','err');
  const b=$('#ct-go'), o=b.innerHTML; b.disabled=true; b.innerHTML='<span class="spin-sm"></span>&nbsp;Enviando…';
  try{
    await db.contato({tipo:CTipo, mensagem:msg, nome:nome, email:email, material:CTipo==='indicacao'?CMat:null, titulo:titulo, url:url});
    const titulo_ok = CTipo==='indicacao' ? 'Indicação recebida!' : CTipo==='elogio' ? 'Valeu demais! 💙' : 'Mensagem recebida!';
    const texto_ok  = CTipo==='elogio'
      ? `Que bom que você curtiu — isso dá um gás enorme pra continuar.${email?' Se fizer sentido, a gente responde no seu e-mail.':''}`
      : `Obrigado por contribuir com a Plataforma LUCAS. A gente lê tudo com carinho${email?' e responde no seu e-mail quando fizer sentido':''}.`;
    render(`
      <div class="center-state ok"><span class="ic">${IC.check}</span>
        <h1 class="h2">${titulo_ok}</h1>
        <p class="lede" style="max-width:40ch;margin:10px auto 0;font-size:15px;">${texto_ok}</p>
      </div>
      <div class="cta-wrap"><button class="btn btn-ghost btn-block" onclick="nav('/')">Voltar ao início</button></div>`);
  }catch(e){ b.disabled=false; b.innerHTML=o; toast(e.message||'Não consegui enviar','err'); }
}
